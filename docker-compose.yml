version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mutualhire_postgres
    environment:
      POSTGRES_DB: mutualhire_db
      POSTGRES_USER: mutualhire_user
      POSTGRES_PASSWORD: ilovemason
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: